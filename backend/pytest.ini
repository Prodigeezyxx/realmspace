[pytest]
testpaths = tests
# backend/ so `import app` works; repo root so `perception.bus_client` does.
# The producer's buffer logic is tested here rather than in perception/ because
# this is the venv that always gets run, and bus_client.py deliberately has no
# cv2 dependency so it imports fine.
pythonpath = . ..
asyncio_mode = auto
# every async fixture lives as long as the test that asked for it unless it
# says otherwise
asyncio_default_fixture_loop_scope = function
