# One-command local boot — Week 1 task 1.1.
#
#   cp .env.example .env && $EDITOR .env      # set two secrets
#   docker compose up --build
#   docker compose exec app python -m app.auth.seed
#
# Brings up Postgres, Neo4j and the backend with nothing else installed. Useful
# if you want a backend to talk to rather than a Python environment to maintain
# — which is most people who are not working on the backend itself.
#
# ## Host ports are deliberately not the defaults
#
# A dev machine that has been through backend/README.md already has Postgres on
# 5432 and Neo4j on 7474/7687 via brew. Publishing on those would refuse to
# bind. Remapping means both can run at once, and the alternative — "stop your
# brew services first" — turns a one-command boot into three and breaks a
# working setup every time you use it.
#
# Inside the compose network the app reaches `postgres:5432` and `neo4j:7687`
# by service name, so the remapping only affects reaching them from the host.
#
# ## Qdrant is not here
#
# PRD.md §11 lists it. Nothing in the codebase uses it — embeddings are Phase 2
# at the earliest. A service every boot waits on, for a feature that does not
# exist, only makes the "<60s" criterion harder to hit.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: realmspace
      POSTGRES_PASSWORD: realmspace
      POSTGRES_DB: realmspace
    ports:
      - "55432:5432"
    volumes:
      - rs_pg_data:/var/lib/postgresql/data
    healthcheck:
      # -U matters: pg_isready defaults to the OS user, which is `root` in this
      # image, and would report not-ready forever while the server is fine.
      test: ["CMD-SHELL", "pg_isready -U realmspace -d realmspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Skip the "please change your password" dance the brew install makes you
      # do by hand — the password is set above, from your .env.
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "7475:7474"   # browser
      - "7688:7687"   # bolt
    volumes:
      - rs_neo4j_data:/data
    healthcheck:
      # Single $ — compose substitutes the password when it parses this file,
      # rather than the container resolving it at runtime. It has to be that way
      # round: the Neo4j image treats every NEO4J_* environment variable as a
      # config setting, so passing NEO4J_PASSWORD in would make it read a
      # setting named "PASSWORD" and refuse to start. (Found by running it.)
      #
      # The consequence is that the password appears in `docker inspect`. For a
      # local dev stack whose password is already sitting in .env next to it,
      # that is not a meaningful additional exposure.
      test:
        ["CMD-SHELL",
         "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      # Neo4j is a JVM and takes appreciably longer to be ready than Postgres.
      # start_period exists precisely so those slow first seconds do not count
      # as failures and burn the retry budget.
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      # Service names, not localhost. Verified that environment variables take
      # precedence over the .env file in pydantic-settings, so this wins without
      # the image ever containing a .env.
      # The app connects as realmspace_app, which migration 0003 creates and
      # which is neither a superuser nor an owner — so the row-level security
      # policies actually apply to it. POSTGRES_USER (`realmspace`) is a
      # superuser in this image and would bypass them entirely.
      DATABASE_URL: postgresql+asyncpg://realmspace_app@postgres:5432/realmspace
      # Alembic needs CREATE/ALTER, and creates the app role itself.
      ADMIN_DATABASE_URL: postgresql+asyncpg://realmspace:realmspace@postgres:5432/realmspace
      # No TEST_DATABASE_URL: this stack creates only `realmspace`, and
      # pointing at a `realmspace_test` that does not exist would give anyone
      # running pytest in the container a confusing connection error. Tests run
      # against the brew databases — see backend/README.md.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # No default, on purpose. A shipped default signing secret is a token
      # anyone can forge; compose should refuse to start rather than invent one.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env — see .env.example}"
      ENV: local
    ports:
      - "8000:8000"

volumes:
  rs_pg_data:
  rs_neo4j_data:
