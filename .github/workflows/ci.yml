name: CI

# There was no CI at all until 2026-08-21, against 723 tests that ran only when
# somebody remembered — including the ones that assert a stolen device key
# cannot read the log, that a withdrawal reaches every CRM, and that a privacy
# mask is applied before the model sees the frame. Those are the tests you least
# want running on the honour system.
#
# ## Why it could not have existed before
#
# `backend/tests/conftest.py` built its owner connection by substituting one
# developer's macOS username into the test URL, so the suite ran on exactly one
# machine. It now prefers `TEST_ADMIN_DATABASE_URL`, which is what this file
# sets. That is the whole unlock.
#
# ## Why lint reports but does not gate
#
# `eslint src` has 7 pre-existing errors (3 × "impure function during render",
# 3 × "setState in effect", 1 × prefer-const) in viz/, mock/ and twin/, none of
# them new. Gating on a rule the repo already violates makes the first run red
# and every run after it, and a permanently-red check gets filtered out of
# people's inboxes within a week — the same failure `/ops` was designed to avoid
# one level down, where an ignored queue is worse than no queue because it looks
# like coverage.
#
# Tests, types and build are all green today, so those gate: red means something
# broke, which is the only signal worth paging on. The 7 errors are tracked in
# roadmap.md rather than suppressed here.

on:
  push:
  pull_request:

concurrency:
  # A second push to the same branch makes the first run's answer irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      # Mirrors docker-compose.yml so a failure here is reproducible with
      # `docker compose up` rather than being a property of CI.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: realmspace
          POSTGRES_PASSWORD: realmspace
          POSTGRES_DB: realmspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realmspace -d realmspace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/realmspace
          NEO4J_server_memory_heap_max__size: 512M
          NEO4J_server_memory_pagecache_size: 256M
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      # `realmspace` owns the database here, where locally it is the developer's
      # own account. Migration 0003 creates the `realmspace_app` role itself, so
      # nothing has to provision it.
      TEST_DATABASE_URL: postgresql+asyncpg://realmspace_app:realmspace@localhost:5432/realmspace_test
      # Its own variable, deliberately not ADMIN_DATABASE_URL — that one means
      # the *application's* owner connection and points at the dev database.
      # conftest truncates nine tables and bypasses RLS through this one.
      TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://realmspace:realmspace@localhost:5432/realmspace_test
      DATABASE_URL: postgresql+asyncpg://realmspace_app:realmspace@localhost:5432/realmspace_test
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: realmspace
      NEO4J_DATABASE: neo4j
      JWT_SECRET: ci-only-not-a-real-secret-value-32ch
      ENV: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Let the app role in
        # Migration 0003 creates this role with LOGIN and **no password**, which
        # is right locally: a dev box connects over a unix socket under peer or
        # trust auth. Over TCP, Postgres wants a method it recognises, so the
        # password is set here — and 0003's `IF NOT EXISTS` guard then finds the
        # role already present, which is a branch that migration has had since it
        # was written ("a second database in the same cluster … must not fail on
        # an already-existing role").
        #
        # `ALTER` in the else branch rather than nothing, so this is idempotent
        # against a *reused* cluster too. Found by running it: a cluster that had
        # already applied 0003 has the role with no password, the create is
        # skipped, and every connection then fails authentication with no clue
        # that the role predates the run.
        run: |
          PGPASSWORD=realmspace psql -h localhost -U realmspace -d realmspace_test \
            -c "DO \$\$ BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'realmspace_app') THEN
                    CREATE ROLE realmspace_app LOGIN PASSWORD 'realmspace';
                  ELSE
                    ALTER ROLE realmspace_app LOGIN PASSWORD 'realmspace';
                  END IF;
                END \$\$;"

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npx vitest run

      - name: Types
        run: npx tsc --noEmit -p .

      - name: Build
        run: npx next build

      - name: Lint
        # Reports, does not gate. See the header of this file.
        run: npx eslint src || true
